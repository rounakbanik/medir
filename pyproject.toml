[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-repurpose-ir"
version = "0.1.0"
description = "Evidence-backed bidirectional drug repurposing retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3", "httpx>=0.27,<1",
  "pydantic>=2.7,<3", "PyYAML>=6,<7", "typer>=0.12,<1",
  "pyahocorasick>=2,<3", "python-dotenv>=1,<2",
  "nltk>=3.8,<4", "spacy>=3.7,<4", "pandas>=2,<4", "tqdm>=4.66,<5",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3,<6"]
learning = ["lightgbm>=4,<5", "scikit-network>=0.31,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
drugir = "drug_repurpose_ir.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drug_repurpose_ir.ir" = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Preserve the reference source's formatting, comments, and docstrings.
extend-exclude = ["src/drug_repurpose_ir/ir"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
